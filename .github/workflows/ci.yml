name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Ruff
        run: |
          ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify CARLA is not installed
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('carla') is None, 'Core CI must not install CARLA'"

      - name: Enforce simulator boundary
        run: |
          python scripts/check_simulator_boundary.py --smoke
          python -m pytest tests/unit/test_boundary.py

      - name: Run tests
        run: |
          python -m pytest

      - name: Run five offline S0 acceptance trials
        run: python scripts/run_s0_acceptance.py --output runs/S0

      - name: Retain acceptance logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-s0-acceptance
          path: runs/S0
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Check module inventory
        run: python scripts/generate_module_notes.py --check

      - name: Build documentation
        run: |
          sphinx-build -W docs docs/_build/html

      - name: Preserve generated API and module documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
          if-no-files-found: error

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run Ruff
        run: |
          ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Verify CARLA is not installed
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('carla') is None, 'Core CI must not install CARLA'"

      - name: Enforce simulator boundary
        run: |
          python scripts/check_simulator_boundary.py --smoke
          python -m pytest tests/unit/test_boundary.py

      - name: Run tests
        run: |
          python -m pytest

      - name: Record CARLA-free S0 evidence
        run: python scripts/run_scenario.py --engine harness --scenario S0 --output runs/ci-S0

      - name: Upload harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-S0
          path: runs/ci-S0

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build documentation
        run: |
          sphinx-build -W docs docs/_build/html

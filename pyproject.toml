[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elec5308-group7-autodrive"
version = "0.1.0"
description = "Simulator-independent autonomous perception and navigation library."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "ultralytics",
]

[project.optional-dependencies]
test = [
    "pytest",
]
carla = [
    "carla==0.9.16",
]
training = [
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

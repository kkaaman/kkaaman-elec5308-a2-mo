[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elec5308-group7-autodrive"
version = "0.2.0.dev0"
description = "Simulator-independent autonomous perception and navigation library."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "ultralytics",
]

[project.optional-dependencies]
test = [
    "pytest",
    "ruff",
]
docs = [
    "sphinx",
    "myst-parser",
]
carla = [
    "carla==0.9.16",
]
training = [
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_carla_adapter.py" = ["E402"]
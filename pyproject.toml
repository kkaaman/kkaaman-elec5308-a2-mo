[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elec5308-group7-autodrive"
version = "0.2.0.dev0"
description = "Simulator-independent autonomous perception and navigation library."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "ultralytics",
    "PyYAML",
    "matplotlib",
    "lap>=0.5.12",
]

[project.optional-dependencies]
test = [
    "pytest",
    "ruff",
]
docs = [
    "sphinx",
    "myst-parser",
]
carla = [
    "carla==0.9.16",
]
training = [
    "pandas",
]

[tool.setuptools]
package-dir = {"" = "src"}
# A1 helper modules that still sit directly in src/. Installing them means they
# import from any working directory (no `cd src`). They move into geometry/,
# planning/ and visualisation/ later, keeping these names as shims.
py-modules = [
    "ground_projection",
    "lane_to_waypoints",
    "overlay_enhancements",
    "traffic_light_color",
    "turn_decision",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets test files in different folders share a base name
# (tests/unit/test_path.py and tests/navigation_control/test_path.py).
addopts = "--import-mode=importlib"
markers = [
    "carla: needs a CARLA 0.9.16 server and client; lives in tests/carla/",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "TID251"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"carla".msg = "Keep simulator APIs in carla_adapter; core uses plain contracts."
"carla_adapter".msg = "Core must not depend on the CARLA adapter."

[tool.ruff.lint.per-file-ignores]
# Adapter implementations and existing simulator entry points only. The AST
# check independently prevents core from depending on these exempt modules.
"src/carla_adapter/*.py" = ["TID251"]
"src/demo_combined_perception.py" = ["TID251"]
"src/demo_fused_lane_following.py" = ["TID251"]
"examples/run_carla_demo.py" = ["TID251"]
"examples/a1/run_baseline.py" = ["TID251"]
"scripts/export_lane_graph.py" = ["TID251"]
"scripts/calibrate_vehicle.py" = ["TID251"]
"scripts/check_junction_routes.py" = ["TID251"]
"scripts/check_rgbd_capture.py" = ["TID251"]
"tests/unit/test_rgbd_capture.py" = ["TID251"]
"tests/test_carla_adapter.py" = ["E402", "TID251"]
"tests/unit/test_world_lifecycle.py" = ["TID251"]
"tests/unit/test_vehicle_geometry.py" = ["TID251"]
"tests/unit/test_topology_export.py" = ["TID251"]

"scripts/run_scenario.py" = ["TID251"]
"scripts/prepare_mission.py" = ["TID251"]
"scripts/calibrate_depth.py" = ["TID251"]
"scripts/calibrate_longitudinal.py" = ["TID251"]
"scripts/capture_frames.py" = ["TID251"]
"scripts/verify_event_sensors.py" = ["TID251"]

"tests/unit/test_batch35_dataset.py" = ["TID251"]
"tests/unit/test_batch35_calibration.py" = ["TID251"]

"tests/unit/test_batch35_world_guards.py" = ["TID251"]
"tests/unit/test_event_verification.py" = ["TID251"]
"tests/integration/test_shadow_localisation.py" = ["TID251"]

# Mapless extension: simulator entry points and their fake-carla tests only.
"scripts/check_sensor_rig.py" = ["TID251"]
"scripts/capture_mapless_dataset.py" = ["TID251"]
"scripts/repair_mapless_capture.py" = ["TID251"]
"scripts/check_geolocation.py" = ["TID251"]
"scripts/make_satnav_route.py" = ["TID251"]
"scripts/run_mapless_drive.py" = ["TID251"]
"tests/unit/test_sensor_rig.py" = ["TID251"]
"tests/unit/test_mapless_capture_check.py" = ["TID251"]
"tests/unit/test_sensor_rig_check_smoke.py" = ["TID251"]
"tests/unit/test_mapless_drive_smoke.py" = ["TID251"]
